<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>CampusPass</title>
    <style>
        html, body {
            height: 100%;
        }

        .login-visual {
            position: relative;
            min-height: 100vh;
            background: url('https://picsum.photos/seed/campuspass/900/1200') center / cover no-repeat;
        }

        .login-visual::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(13,20,40,.35) 0%, rgba(13,20,40,.55) 60%, rgba(13,20,40,.85) 100%);
        }

        .login-visual > * {
            position: relative;
            z-index: 1;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(255, 255, 255, .92);
            border-radius: .75rem;
            padding: .5rem .9rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: .75rem;
            color: var(--bs-secondary-color);
            font-size: .85rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--bs-border-color);
        }

        .form-control-icon {
            border-left: 0;
        }

        .input-group .input-group-text {
            background: transparent;
            border-right: 0;
            color: var(--bs-secondary-color);
        }

        .input-group:focus-within .input-group-text {
            border-color: #86b7fe;
        }
    </style>
</head>

<body>
    <div class="row g-0" style="min-height: 100vh;">
        <div class="col-lg-6 d-none d-lg-flex login-visual flex-column justify-content-between p-5">
            <div class="brand-badge">
                <img src="logo.svg" alt="CampusPass" width="150">
            </div>
            <div class="text-white">
                <h2 class="fw-bold mb-3">Seu próximo rolê está a um clique.</h2>
                <p class="mb-0 opacity-75">
                    Ingressos para as melhores festas e eventos da sua universidade, tudo em um só lugar.
                </p>
            </div>
        </div>
        <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
            <div style="width: 100%; max-width: 380px;">

                <div class="text-center d-lg-none mb-4">
                    <img src="logo.svg" alt="CampusPass" width="150">
                </div>

                <h4 class="fw-bold mb-1">Entrar na sua conta</h4>
                <p class="text-body-secondary mb-4">Bem-vindo de volta! Insira seus dados.</p>

                <form class="d-flex flex-column gap-3">
                    <div>
                        <label for="loginEmail" class="form-label small fw-semibold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control form-control-icon" id="loginEmail"
                                placeholder="seu@email.com" required>
                        </div>
                    </div>

                    <div>
                        <label for="loginPassword" class="form-label small fw-semibold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control form-control-icon" id="loginPassword"
                                placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Lembrar de mim</label>
                        </div>
                        <a href="#" class="small text-decoration-none">Esqueci minha senha</a>
                    </div>

                    <a href="index.html" class="btn btn-primary w-100 py-2">Entrar</a>
                </form>

                <div class="divider my-4">ou continue com</div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary social-btn w-100">
                        <i class="bi bi-google"></i> Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary social-btn w-100">
                        <i class="bi bi-apple"></i> Apple
                    </button>
                </div>

                <p class="text-center text-body-secondary mt-4 mb-0">
                    Não tem conta? <a href="cadastro.html" class="fw-semibold text-decoration-none">Cadastra-se</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        (() => {
            'use strict';
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('loginPassword');
            const icon = toggleBtn.querySelector('i');

            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                icon.classList.toggle('bi-eye');
                icon.classList.toggle('bi-eye-slash');
            });
        })();
    </script>
</body>
</html>

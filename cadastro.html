<!DOCTYPE html>
<html lang="pt-br"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Criar conta · CampusPass</title>
</head>
<body data-page="cadastro">
<main class="wrap" style="max-width:720px;margin-top:48px">
  <form class="card" id="f" novalidate>
    <h2 style="margin-bottom:24px">Criar conta</h2>
    <div class="form-grid">
      <div class="field s2">
        <label for="email">Email</label>
        <input class="in" type="email" id="email" placeholder="exemplo@mail.com" autocomplete="email" required>
        <span class="hint">Use seu email da universidade</span><span class="msg">Email inválido</span></div>
      <div class="field s2">
        <label for="senha">Senha</label>
        <input class="in" type="password" id="senha" minlength="6" autocomplete="new-password" required>
        <span class="msg">Mínimo de 6 caracteres</span></div>
      <div class="field s2">
        <label for="conf">Confirmar senha</label>
        <input class="in" type="password" id="conf" autocomplete="new-password" required>
        <span class="msg">As senhas não coincidem</span></div>
      <div class="field s6">
        <label for="end">Endereço</label>
        <input class="in" id="end" placeholder="Rua Exemplo, 123" required>
        <span class="msg">Informe o endereço</span></div>
      <div class="field s6">
        <label for="end2">Complemento</label>
        <input class="in" id="end2" placeholder="Apto, bloco, referência (opcional)"></div>
      <div class="field s3">
        <label for="cidade">Cidade</label>
        <input class="in" id="cidade" required>
        <span class="msg">Informe a cidade</span></div>
      <div class="field s2">
        <label for="uf">Estado</label>
        <select class="in" id="uf" required>
          <option value="">Escolha...</option>
          <option>São Paulo</option>
          <option>Rio de Janeiro</option>
          <option>Rio Grande do Sul</option>
          <option>Minas Gerais</option>
          <option>Paraná</option>
        </select>
        <span class="msg">Escolha um estado</span>
      </div>
      <div class="field" style="grid-column:span 1">
        <label for="cep">CEP</label>
        <input class="in" id="cep" inputmode="numeric" pattern="\d{5}-?\d{3}" placeholder="00000-000" required>
        <span class="msg">CEP inválido</span>
      </div>
      <div class="field s6">
        <label style="display:flex;gap:8px;align-items:center;font-weight:400">
          <input type="checkbox" id="termos" required style="width:18px;height:18px;accent-color:var(--violet)">
          <a href="#" style="color:var(--link)">Li e aceito os termos do contrato</a>
        </label>
          <span class="msg">Você precisa aceitar os termos</span></div>
    </div>
    <div style="text-align:center;margin-top:24px">
      <button class="btn btn-primary" type="submit" id="btnCadastrar">Cadastrar</button>
      <p class="err-top" id="cadastroErro" style="margin-top:12px"></p>
    </div>
  </form>
</main>
<script src="site.js"></script>
</body></html>

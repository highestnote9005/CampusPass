<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>CampusPass</title>
</head>
<body>
<div class="container mt-5" style="max-width: 700px;">
        <h3 class="text-center mb-4">Criar conta</h3>
        <form class="row g-3 needs-validation" novalidate>
            <div class="col-md-4">
                <label for="inputEmail4" class="form-label text-primary">Email</label>
                <input type="email" class="form-control" id="inputEmail4" name="email"
                    placeholder="exemplo@mail.com" autocomplete="email" required>
                <div class="invalid-feedback">Informe um email válido.</div>
            </div>
            <div class="col-md-4">
                <label for="inputPassword4" class="form-label text-primary">Senha</label>
                <input type="password" class="form-control" id="inputPassword4" name="password"
                    autocomplete="new-password" minlength="6" required>
                <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
            </div>
            <div class="col-md-4">
                <label for="inputPasswordConfirm" class="form-label text-primary">Confirmar senha</label>
                <input type="password" class="form-control" id="inputPasswordConfirm" name="password_confirm"
                    autocomplete="new-password" minlength="6" required>
                <div class="invalid-feedback">As senhas não coincidem.</div>
            </div>
            <div class="col-12">
                <label for="inputAddress" class="form-label text-primary">Endereço 1</label>
                <input type="text" class="form-control" id="inputAddress" name="address"
                    placeholder="Rua Exemplo, 123" required>
                <div class="invalid-feedback">Informe o endereço.</div>
            </div>
            <div class="col-12">
                <label for="inputAddress2" class="form-label text-primary">Endereço 2</label>
                <input type="text" class="form-control" id="inputAddress2" name="address2"
                    placeholder="Apto, bloco, referência (opcional)">
            </div>
            <div class="col-md-6">
                <label for="inputCity" class="form-label text-primary">Cidade</label>
                <input type="text" class="form-control" id="inputCity" name="city" required>
                <div class="invalid-feedback">Informe a cidade.</div>
            </div>
            <div class="col-md-4">
                <label for="inputState" class="form-label text-primary">Estado</label>
                <select id="inputState" name="state" class="form-select" required>
                    <option selected disabled value="">Escolha...</option>
                    <option>São Paulo</option>
                    <option>Rio de Janeiro</option>
                    <option>Rio Grande do Sul</option>
                    <option>Minas Gerais</option>
                    <option>Paraná</option>
                </select>
                <div class="invalid-feedback">Escolha um estado.</div>
            </div>
            <div class="col-md-2">
                <label for="inputZip" class="form-label text-primary">Código postal</label>
                <input type="text" class="form-control" id="inputZip" name="zip"
                    inputmode="numeric" pattern="\d{5}-?\d{3}" placeholder="00000-000" required>
                <div class="invalid-feedback">CEP inválido.</div>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck" name="terms" required>
                    <a href="#">Eu li e aceito os termos do contrato</a>
                    <div class="invalid-feedback">Você precisa aceitar os termos.</div>
                </div>
                
            </div>
            <div class="col-12 text-center">
                <a href="index.html" class="btn btn-primary">Cadastrar</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        (() => {
            'use strict'
            const form = document.querySelector('.needs-validation')
            const password = document.getElementById('inputPassword4')
            const confirm = document.getElementById('inputPasswordConfirm')

            form.addEventListener('submit', event => {
                if (password.value !== confirm.value) {
                    confirm.setCustomValidity('As senhas não coincidem.')
                } else {
                    confirm.setCustomValidity('')
                }

                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                form.classList.add('was-validated')
            })
        })()
    </script>
</body>
</html>

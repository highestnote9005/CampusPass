<!DOCTYPE html>
<html lang="pt-br">
  <head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Entrar · CampusPass</title>
  </head>
<body data-bare data-page="login">
<div class="auth">
  <aside class="auth-art">
    <a class="brand" href="index.html">
      <img src="logo.svg" alt="CampusPass" width="140" height="41">
    </a>
    <div>
      <h1>Seu próximo rolê está a um clique.</h1>
      <p style="margin-top:16px;max-width:36ch">Ingressos para as melhores festas e eventos da sua universidade, em um só lugar.</p>
    </div>
  </aside>
  <main class="auth-form">
    <form class="auth-box" id="f" novalidate>
    <h2>Entrar na sua conta</h2>
    <p class="small">Bem-vindo de volta! Insira seus dados.</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input class="in" type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email" required>
      <span class="msg">Email inválido</span>
    </div>
    <div class="field">
      <label for="loginPassword">Senha</label>
      <div class="pw">
        <input class="in" type="password" id="loginPassword" autocomplete="current-password" required>
        <button type="button" class="btn btn-sec" id="togglePassword">Mostrar</button>
      </div>
      <span class="msg">Informe sua senha</span>
    </div>
    <a href="#" class="small" style="color:var(--link)">Esqueci minha senha</a>
    <button type="submit" class="btn btn-primary btn-block" id="btnEntrar">Entrar</button>
    <p class="err-top" id="loginErro"></p>
    <div class="two">
      <button type="button" class="btn btn-sec">Google</button>
      <button type="button" class="btn btn-sec">Apple</button>
    </div>
    <p class="small" style="text-align:center">Não tem conta? 
      <a href="cadastro.html" style="color:var(--link);font-weight:600">Cadastre-se</a>
    </p>
  </form>
</main>
</div>
<script src="site.js"></script>
</body></html>
